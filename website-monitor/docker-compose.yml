version: '3.8'

services:
  website-monitor:
    build: .
    container_name: website-monitor
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_HOST=host.docker.internal
      - DATABASE_PORT=3306
      - DATABASE_NAME=t_monitor
      - DATABASE_USER=t_monitor
      - DATABASE_PASSWORD=批量替换_请输入数据库密码
      - JWT_SECRET=your-secret-key-change-this-in-production
    networks:
      - monitor-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  monitor-network:
    driver: bridge
