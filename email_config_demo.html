<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>邮件配置修复演示</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .glass-effect {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="glass-effect rounded-3xl p-8 w-full max-w-lg shadow-2xl">
        <h2 class="text-2xl font-bold mb-6 text-gray-800">邮件配置演示</h2>
        
        <div id="app">
            <div class="space-y-4">
                <!-- 邮件服务商选择 -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        邮件服务商 *
                    </label>
                    <select id="smtpProvider" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <option value="">选择邮件服务商</option>
                        <option value="smtp.gmail.com">Gmail</option>
                        <option value="smtp.qq.com">QQ邮箱</option>
                        <option value="smtp.163.com">163邮箱</option>
                        <option value="smtp.126.com">126邮箱</option>
                        <option value="smtp.outlook.com">Outlook/Hotmail</option>
                        <option value="smtp.yandex.com">Yandex邮箱</option>
                        <option value="custom">自定义SMTP服务器</option>
                    </select>
                </div>

                <!-- 自定义SMTP服务器输入框 -->
                <div id="customSmtpSection" style="display: none;">
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        自定义SMTP服务器 *
                    </label>
                    <input 
                        type="text" 
                        id="customSmtpHost"
                        class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        placeholder="输入自定义SMTP服务器地址"
                    >
                </div>

                <!-- 其他配置 -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        SMTP端口 *
                    </label>
                    <input 
                        type="number" 
                        id="smtpPort"
                        class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        placeholder="587"
                    >
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        用户名 *
                    </label>
                    <input 
                        type="email" 
                        class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        placeholder="your-email@gmail.com"
                    >
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        密码 *
                    </label>
                    <input 
                        type="password" 
                        class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        placeholder="SMTP密码"
                    >
                </div>
            </div>

            <!-- 状态显示 -->
            <div class="mt-6 p-4 bg-blue-50 rounded-xl">
                <h3 class="font-semibold text-blue-800 mb-2">当前配置状态：</h3>
                <div id="status" class="text-sm text-blue-600 space-y-1">
                    <div>SMTP服务商: <span id="currentProvider">未选择</span></div>
                    <div>显示自定义输入框: <span id="showCustom">否</span></div>
                    <div>自定义服务器值: <span id="customValue">-</span></div>
                    <div>端口: <span id="portValue">-</span></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 模拟修复后的逻辑
        const presetProviders = ['smtp.gmail.com', 'smtp.qq.com', 'smtp.163.com', 'smtp.126.com', 'smtp.outlook.com', 'smtp.yandex.com'];
        
        const smtpProvider = document.getElementById('smtpProvider');
        const customSmtpSection = document.getElementById('customSmtpSection');
        const customSmtpHost = document.getElementById('customSmtpHost');
        const smtpPort = document.getElementById('smtpPort');
        
        const currentProvider = document.getElementById('currentProvider');
        const showCustom = document.getElementById('showCustom');
        const customValue = document.getElementById('customValue');
        const portValue = document.getElementById('portValue');
        
        let currentConfig = {
            smtp_host: '',
            smtp_port: '',
            smtp_secure: false
        };
        
        // 下拉框change事件
        smtpProvider.addEventListener('change', (e) => {
            const selectedValue = e.target.value;
            
            if (selectedValue === '') {
                currentConfig.smtp_host = '';
                currentConfig.smtp_port = '';
                currentConfig.smtp_secure = false;
            } else if (selectedValue === 'custom') {
                // 选择自定义时保持现有值，显示输入框让用户输入
                // 这里模拟修复后的逻辑
                currentConfig.smtp_host = currentConfig.smtp_host || '';
                currentConfig.smtp_port = '';
                currentConfig.smtp_secure = false;
            } else if (presetProviders.includes(selectedValue)) {
                // 预设服务商的自动配置
                currentConfig.smtp_host = selectedValue;
                if (selectedValue === 'smtp.gmail.com' || selectedValue === 'smtp.qq.com' || selectedValue === 'smtp.outlook.com') {
                    currentConfig.smtp_port = '587';
                    currentConfig.smtp_secure = false;
                } else {
                    currentConfig.smtp_port = '465';
                    currentConfig.smtp_secure = true;
                }
            }
            
            updateUI();
        });
        
        // 自定义输入框change事件
        customSmtpHost.addEventListener('input', (e) => {
            currentConfig.smtp_host = e.target.value;
            updateUI();
        });
        
        function updateUI() {
            // 更新下拉框显示
            const isPreset = presetProviders.includes(currentConfig.smtp_host);
            smtpProvider.value = isPreset ? currentConfig.smtp_host : 'custom';
            
            // 显示/隐藏自定义输入框
            const shouldShowCustom = !isPreset;
            customSmtpSection.style.display = shouldShowCustom ? 'block' : 'none';
            
            if (shouldShowCustom) {
                customSmtpHost.value = currentConfig.smtp_host;
            }
            
            // 更新端口
            smtpPort.value = currentConfig.smtp_port;
            
            // 更新状态显示
            currentProvider.textContent = isPreset ? currentConfig.smtp_host : '自定义';
            showCustom.textContent = shouldShowCustom ? '是' : '否';
            customValue.textContent = shouldShowCustom ? (currentConfig.smtp_host || '(空)') : '-';
            portValue.textContent = currentConfig.smtp_port || '(空)';
        }
        
        // 演示序列
        const demoSteps = [
            { action: '选择Gmail', delay: 1000 },
            { action: '选择自定义', delay: 2000 },
            { action: '输入自定义服务器', delay: 3000 },
            { action: '切换回预设', delay: 4000 }
        ];
        
        let currentStep = 0;
        
        function runDemo() {
            if (currentStep >= demoSteps.length) return;
            
            const step = demoSteps[currentStep];
            
            switch(step.action) {
                case '选择Gmail':
                    smtpProvider.value = 'smtp.gmail.com';
                    smtpProvider.dispatchEvent(new Event('change'));
                    console.log('演示步骤：选择Gmail');
                    break;
                    
                case '选择自定义':
                    smtpProvider.value = 'custom';
                    smtpProvider.dispatchEvent(new Event('change'));
                    console.log('演示步骤：选择自定义');
                    setTimeout(() => {
                        customSmtpHost.value = 'mail.example.com';
                        customSmtpHost.dispatchEvent(new Event('input'));
                        console.log('演示步骤：输入自定义服务器 mail.example.com');
                    }, 500);
                    break;
                    
                case '切换回预设':
                    smtpProvider.value = 'smtp.qq.com';
                    smtpProvider.dispatchEvent(new Event('change'));
                    console.log('演示步骤：切换回QQ邮箱');
                    break;
            }
            
            currentStep++;
            setTimeout(runDemo, step.delay);
        }
        
        // 页面加载后运行演示
        setTimeout(runDemo, 1000);
    </script>
</body>
</html>
